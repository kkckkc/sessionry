<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' sessionry:; script-src 'self' 'unsafe-inline' sessionry:; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sessionry</title>
    <!-- Maps bare specifiers used by external plugin bundles to host-provided
         shared libraries served via the sessionry:// protocol. This ensures
         all plugins share the same React instance as the host app. -->
    <script type="importmap">
      {
        "imports": {
          "react": "sessionry://host/react.js",
          "react-dom": "sessionry://host/react-dom.js",
          "react/jsx-runtime": "sessionry://host/react-jsx-runtime.js",
          "@sessionry/plugin-api": "sessionry://host/plugin-api.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
